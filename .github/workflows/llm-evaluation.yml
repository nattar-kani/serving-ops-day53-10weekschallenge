name: LLM Evaluation CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  evaluation:
    name: Evaluation and Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install CI dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-ci.txt

      - name: Validate assessment schema
        run: |
          python src/evaluation/validate_assessment.py

      - name: Validate evaluation baseline
        run: |
          python src/evaluation/validate_baseline.py

      - name: Run tests
        run: |
          python -m pytest -q

      - name: Run Ruff
        run: |
          ruff check src tests